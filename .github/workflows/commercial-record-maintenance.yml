name: Conferir registros comerciais selecionados

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: audit
        options: [audit, apply]
      public_key:
        type: string
        required: true

permissions:
  contents: read

jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vertex_conversion
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: vertex_conversion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_conversion -d vertex_conversion_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar o fluxo de venda em banco isolado
        if: inputs.mode == 'apply'
        env:
          DATABASE_URL: postgresql://vertex_conversion:fixture-only-password@127.0.0.1:5432/vertex_conversion_ci
          DATABASE_URL_UNPOOLED: postgresql://vertex_conversion:fixture-only-password@127.0.0.1:5432/vertex_conversion_ci
          CONVERSION_TEST_DATABASE_URL: postgresql://vertex_conversion:fixture-only-password@127.0.0.1:5432/vertex_conversion_ci
        run: |
          node node_modules/prisma/build/index.js db push --skip-generate
          node --require tsx/cjs tests/integration-quote-conversion-service.cjs
      - name: Conferir e criptografar resultado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          COMMERCIAL_RECORD_MAINTENANCE_PLAN: ${{ secrets.COMMERCIAL_RECORD_MAINTENANCE_PLAN }}
          MAINTENANCE_MODE: ${{ inputs.mode }}
          MAINTENANCE_PUBLIC_KEY: ${{ inputs.public_key }}
        run: node --import tsx scripts/commercial-record-maintenance.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commercial-record-result
          path: commercial-record-result.encrypted.json
          if-no-files-found: ignore
          retention-days: 1
