name: Teste mensal de restauração

on:
  schedule:
    - cron: '30 12 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vertex_restore
          POSTGRES_PASSWORD: vertex_restore
          POSTGRES_DB: vertex_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_restore -d vertex_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      RESTORE_TEST_DATABASE_URL: postgresql://vertex_restore:vertex_restore@127.0.0.1:5432/vertex_restore
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backup:test-restore
