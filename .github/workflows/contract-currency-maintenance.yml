name: Conferir correção de valores de contratos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Conferir registros ou aplicar plano já revisado
        type: choice
        required: true
        default: audit
        options: [audit, apply]
      public_key:
        description: Chave pública temporária para criptografar o resultado (base64 PEM)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: contract-currency-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CONTRACT_CURRENCY_REPAIR_PLAN: ${{ secrets.CONTRACT_CURRENCY_REPAIR_PLAN }}
      MAINTENANCE_MODE: ${{ inputs.mode }}
      MAINTENANCE_PUBLIC_KEY: ${{ inputs.public_key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Preparar dependências
        run: npm ci
      - name: Carregar configuração para gerar a nova versão
        if: inputs.mode == 'apply'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if ! npx vercel@58.4.4 pull --yes --environment=production --token="$VERCEL_TOKEN" > /tmp/currency-vercel-pull.log 2>&1; then
            echo "Não foi possível carregar a configuração. Nenhum contrato foi alterado."
            exit 1
          fi
      - name: Executar plano restrito e criptografar resultado
        run: node --import tsx --env-file-if-exists=.vercel/.env.production.local scripts/contract-currency-maintenance.ts
      - name: Guardar resultado criptografado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-currency-result
          path: contract-currency-result.encrypted.json
          if-no-files-found: ignore
          retention-days: 1
