name: Redefinir acesso solicitado pelo titular

on:
  workflow_dispatch:
    inputs:
      plan_sha256:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: account-password-reset
  cancel-in-progress: false

jobs:
  reset:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Redefinir somente a conta selecionada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          ACCOUNT_PASSWORD_RESET_PLAN: ${{ secrets.ACCOUNT_PASSWORD_RESET_PLAN }}
          RESET_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: node scripts/account-password-reset.mjs
